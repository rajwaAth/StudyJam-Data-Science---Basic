<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Data Science - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-start lg:justify-center p-4 sm:p-6 lg:p-8">

    <!-- Audio Effects (not used on login page, kept optional) -->

    <div id="app" class="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200 relative">
        
        <!-- Top Decoration Line -->
        <div class="h-2 flex w-full">
            <div class="h-full w-1/4 bg-dsc-blue"></div>
            <div class="h-full w-1/4 bg-dsc-red"></div>
            <div class="h-full w-1/4 bg-dsc-yellow"></div>
            <div class="h-full w-1/4 bg-dsc-green"></div>
        </div>

        <!-- Header -->
        <div class="p-5 sm:p-6 md:p-8 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 bg-white relative z-10 border-b border-gray-100">
            <div class="flex items-center gap-4">
                <div class="bg-gray-100 p-3 rounded-full">
                    <i class="fas fa-code text-2xl text-gray-600"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl md:text-2xl font-bold text-gray-800 tracking-tight">Data Science Quiz</h1>
                    <p class="text-xs sm:text-sm text-gray-500 font-medium">Developer Student Clubs Series</p>
                </div>
            </div>
            <div id="user-badge" class="hidden text-right">
                <div class="bg-blue-50 text-dsc-blue px-4 py-1.5 rounded-full text-xs font-bold shadow-sm border border-blue-100">
                    <i class="fas fa-user mr-2"></i><span id="display-nama">User</span>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="relative min-h-[400px]">
            
            <!-- 1. START SCREEN -->
            <div id="start-screen" class="p-6 sm:p-8 md:p-12 text-center fade-in">
                <div class="mb-8 relative inline-block">
                    <div class="absolute inset-0 bg-blue-100 rounded-full blur-xl opacity-60 animate-pulse"></div>
                    <i class="fas fa-laptop-code text-5xl sm:text-6xl text-dsc-blue relative z-10"></i>
                </div>
                
                <h2 class="text-2xl sm:text-3xl font-bold mb-3 text-gray-800">Siap untuk Tantangan?</h2>
                <p class="text-gray-500 mb-8 max-w-md mx-auto leading-relaxed">
                    Sistem akan memilih <span class="text-dsc-red font-bold">soal acak sesuai Week</span> dengan berbagai tipe (Pilihan Ganda, Benar/Salah, Isian, & Centang Banyak).
                </p>

                <form id="login-form" onsubmit="handleLogin(event)" class="max-w-sm mx-auto space-y-5 text-left bg-gray-50 p-5 sm:p-6 rounded-2xl border border-gray-100">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Nama Lengkap</label>
                        <input type="text" id="input-nama" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-dsc-blue focus:ring-2 focus:ring-blue-100 outline-none transition font-medium text-gray-700 placeholder-gray-300" placeholder="Masukkan nama Anda">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">NPM / NIM</label>
                        <input type="text" id="input-npm" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-dsc-blue focus:ring-2 focus:ring-blue-100 outline-none transition font-medium text-gray-700 placeholder-gray-300" placeholder="Nomor Induk Mahasiswa">
                    </div>

                    <!-- Settings Toggle -->
                    <div class="pt-2">
                        <button type="button" onclick="toggleSettings()" class="text-xs text-gray-400 hover:text-dsc-blue flex items-center gap-1 transition-colors">
                            <i class="fas fa-cog"></i> Pengaturan Spreadsheet
                        </button>
                        <div id="settings-panel" class="hidden mt-3 p-3 bg-white rounded-lg border border-gray-200 shadow-sm">
                            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">URL Web App Script</label>
                            <input type="text" id="input-url" class="w-full px-3 py-2 text-xs rounded border border-gray-200 focus:border-dsc-blue outline-none" placeholder="https://script.google.com/...">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-dsc-blue hover:bg-blue-600 text-white font-bold py-3.5 px-6 rounded-xl transition shadow-lg shadow-blue-200 transform hover:-translate-y-0.5 mt-4">
                        Mulai Sekarang
                    </button>
                </form>
            </div>

            <!-- 1.5 WEEK SELECTION SCREEN -->
            <div id="week-screen" class="hidden p-6 sm:p-8 md:p-12 text-center fade-in">
                <div class="mb-8 relative inline-block">
                    <div class="absolute inset-0 bg-yellow-100 rounded-full blur-xl opacity-60 animate-pulse"></div>
                    <i class="fas fa-calendar-week text-5xl sm:text-6xl text-dsc-yellow relative z-10"></i>
                </div>

                <h2 class="text-2xl sm:text-3xl font-bold mb-2 text-gray-800">Pilih Week</h2>
                <p class="text-gray-500 mb-6 max-w-md mx-auto leading-relaxed">
                    Halo <span id="week-user-name" class="font-bold text-gray-700">User</span> (<span id="week-user-npm" class="font-mono text-gray-600">NPM</span>).
                    Pilih paket soal untuk melanjutkan.
                </p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-xl mx-auto">
                    <button id="week1-btn" type="button" onclick="selectWeek(1)" class="p-5 rounded-2xl border border-gray-200 bg-white hover:border-dsc-blue hover:bg-blue-50 transition text-left shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Week 1</div>
                                <div class="text-lg font-bold text-gray-800 mt-1">Mulai Soal Week 1</div>
                                <div class="text-sm text-gray-500 mt-1">Soal yang tersedia saat ini</div>
                            </div>
                            <i class="fas fa-arrow-right text-dsc-blue text-xl"></i>
                        </div>
                    </button>

                    <button id="week2-btn" type="button" onclick="selectWeek(2)" class="p-5 rounded-2xl border border-gray-200 bg-white hover:border-dsc-green hover:bg-green-50 transition text-left shadow-sm">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="text-xs font-bold text-gray-400 uppercase tracking-wider">Week 2</div>
                                <div class="text-lg font-bold text-gray-800 mt-1">Mulai Soal Week 2</div>
                                <div class="text-sm text-gray-500 mt-1">Struktur Data, Kontrol Alur, Fungsi</div>
                            </div>
                            <i class="fas fa-arrow-right text-dsc-green text-xl"></i>
                        </div>
                    </button>
                </div>

                <div id="week-hint" class="text-xs text-gray-500 mt-6 min-h-[18px]"></div>

                <button type="button" onclick="backToLogin()" class="mt-4 text-dsc-blue hover:text-blue-700 font-semibold py-2 text-sm">
                    <i class="fas fa-arrow-left mr-2"></i>Ubah Nama / NPM
                </button>
            </div>

            <!-- Quiz is now in quiz.html -->

        </div>
    </div>

    <script src="Script/login.js"></script>
</body>
</html>
